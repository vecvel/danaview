name: danaview
description: "Danaview - All-in-one cross-platform media player, native camera, and unified photo & video editor."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  shared_preferences: ^2.2.3

  # Internal Modular Packages
  danaview_domain:
    path: packages/danaview_domain
  danaview_engine:
    path: packages/danaview_engine
  danaview_data:
    path: packages/danaview_data
  danaview_ui_kit:
    path: packages/danaview_ui_kit
  danaview_platform:
    path: packages/danaview_platform
  danaview_features:
    path: packages/danaview_features
  danaview_editor:
    path: packages/danaview_editor
  danaview_editor_engine:
    path: packages/danaview_editor_engine
  danaview_editor_engine_api:
    path: packages/danaview_editor_engine_api
  # Auto captions (ARCH §16): the app root builds TranscriptionServiceImpl and feeds its governor
  # from the danaview_whisper device channel (INT-04).
  danaview_transcription:
    path: packages/danaview_transcription
  danaview_whisper:
    path: packages/danaview_whisper
  # Files & Media Home (S2-W, ARCH v1.2 §4.1): the app root opens the library store and adapts the
  # native plugin's backup flag (lib/wiring/files_home_wiring.dart).
  danaview_library:
    path: packages/danaview_library
  danaview_library_native:
    path: packages/danaview_library_native
  # SQLite for library.db (D-7, ARCH v1.2 V-S21): the pure-Dart danaview_library and danaview_search
  # use `sqlite3` 2.x, which loads a native libsqlite3 that Android apps can't take from the OS. The
  # app bundles it here (0.5.x is the line for sqlite3 2.x; 0.6 is end-of-life for sqlite3 3.x).
  sqlite3_flutter_libs: ^0.5.42

  # Native Playback Engine Bindings
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.7
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_ios_video: ^1.1.4

  # Platform & Hardware Integration
  window_manager: ^0.3.8
  wakelock_plus: ^1.2.8
  desktop_drop: ^0.4.4
  file_selector: ^0.9.4
  volume_controller: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Test fakes of the editor (FakeEditorEngine, MemoryStoreFs) for the route tests.
  danaview_editor_core:
    path: packages/danaview_editor_core
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
