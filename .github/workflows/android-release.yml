name: Android Release

on:
  push:
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'apk'
          - 'bundle'
      create_release:
        description: 'Create a GitHub Release'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Create Release as Draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Android Keystore & Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi

          echo "Decoding release.jks..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

          echo "Writing android/key.properties..."
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract Version Info
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          VERSION_NAME=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$PUBSPEC_VERSION" | cut -d'+' -f2)
          
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="android-v${PUBSPEC_VERSION}"
          fi
          
          echo "version=$PUBSPEC_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          
          echo "Target Version: $PUBSPEC_VERSION (Name: $VERSION_NAME, Code: $VERSION_CODE)"
          echo "Target Tag: $TAG_NAME"

      - name: Build Signed App Bundle (AAB)
        if: github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'bundle'
        run: flutter build appbundle --release

      - name: Build Signed Universal APK
        if: github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'apk'
        run: flutter build apk --release

      - name: Build Signed Split-ABI APKs
        if: github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'apk'
        run: flutter build apk --release --split-per-abi

      # ARCH §23 item 4 / D-43(b): whisper libraries exactly arm64-v8a + x86_64, 16 KB LOAD alignment,
      # only dv_* exported, <= 3 MB each. danaview_whisper is linked whatever the editor --dart-defines
      # say, so this holds for flags-off builds too. llvm-readelf comes from the runner's Android NDK
      # (the script looks in ANDROID_NDK_HOME, then ANDROID_HOME/ndk). Archives the chosen build_type
      # didn't build are skipped.
      - name: Check native libraries (ABIs, 16 KB pages, exports, size)
        run: |
          # $1 stays unquoted on purpose: it is empty or "--abis <abi>".
          check() { if [ -f "$2" ]; then bash scripts/ci/editor/check_native_libs.sh $1 "$2"; else echo "not built: $2"; fi; }
          OUT=build/app/outputs
          check "" $OUT/bundle/release/app-release.aab
          check "" $OUT/flutter-apk/app-release.apk
          check "--abis arm64-v8a" $OUT/flutter-apk/app-arm64-v8a-release.apk
          check "--abis x86_64" $OUT/flutter-apk/app-x86_64-release.apk
          # armeabi-v7a carries no whisper library at all (D-43(b)); the check fails if one appears.
          check "--abis=" $OUT/flutter-apk/app-armeabi-v7a-release.apk

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VER="${{ steps.version.outputs.version }}"

          # Copy and rename AAB if built
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "build/app/outputs/bundle/release/app-release.aab" "release-artifacts/danaview-${VER}-bundle.aab"
          fi

          # Copy and rename Universal APK if built
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "release-artifacts/danaview-${VER}-universal.apk"
          fi

          # Copy and rename Split-ABI APKs if built
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "release-artifacts/danaview-${VER}-arm64-v8a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "release-artifacts/danaview-${VER}-armeabi-v7a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-x86_64-release.apk" "release-artifacts/danaview-${VER}-x86_64.apk"
          fi

          # Compute SHA-256 Checksums
          cd release-artifacts
          sha256sum * > checksums-sha256.txt
          cd ..

          echo "Generated Artifacts:"
          ls -lh release-artifacts/

      - name: Generate Release Notes
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Danaview Android Release (${APP_VERSION})"
            echo ""
            echo "Ultra-high performance HDR media player for Android with hardware-accelerated playback."
            echo ""
            echo "### 📦 Download Packages"
            echo "* **Universal APK (\`danaview-${APP_VERSION}-universal.apk\`)**: Standalone installer compatible with all supported Android architectures."
            echo "* **ARM64 APK (\`danaview-${APP_VERSION}-arm64-v8a.apk\`)**: Optimized for modern 64-bit ARM devices (most modern Android phones & tablets)."
            echo "* **ARMv7 APK (\`danaview-${APP_VERSION}-armeabi-v7a.apk\`)**: Optimized for legacy 32-bit ARM devices."
            echo "* **x86_64 APK (\`danaview-${APP_VERSION}-x86_64.apk\`)**: Optimized for Intel/AMD Chromebooks and Android emulators."
            echo "* **App Bundle (\`danaview-${APP_VERSION}-bundle.aab\`)**: Official signed bundle for Google Play Store publishing."
            echo ""
            echo "### 🔒 Integrity & Security"
            echo "All binaries are signed with the official Danaview production release key. Checksums are listed in \`checksums-sha256.txt\`. Verify via:"
            echo "\`\`\`bash"
            echo "sha256sum -c checksums-sha256.txt"
            echo "\`\`\`"
          } > release-notes.md

      - name: Upload Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: danaview-android-${{ steps.version.outputs.version }}
          path: release-artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Danaview Android ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: release-artifacts/*
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          append_body: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
