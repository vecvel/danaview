# OWNER: INT-01
# EXTENDED: AIS-01 (ai-dart job and the AI package paths)
#
# Editor CI (ARCH §22). Every job checks out the repo, then runs its script under
# scripts/ci/editor/ when that script exists and prints a skip notice otherwise (the owning ticket
# creates the script; owners are listed in scripts/ci/editor/README.md). The existing release
# workflows (android-release.yml, linux-release.yml, windows-release.yml) are independent of this
# file.
name: Editor CI

on:
  pull_request:
    paths:
      - 'packages/danaview_editor*/**'
      - 'packages/danaview_transcription/**'
      - 'packages/danaview_whisper/**'
      - 'test/architecture/**'
      - 'scripts/ci/editor/**'
      - '.github/workflows/editor-ci.yml'
      # The architecture test also guards danaview_features (ARCH §4.2 rule 1 and the ARCH §1.3
      # Material scan) and reads the BUILD_PLAN owns lists, so changes there run it too.
      - 'packages/danaview_features/**'
      - 'docs/v1.1/editor/BUILD_PLAN.md'
      # 1.2.0 AI packages (AIS-01): danaview_ai_providers, danaview_ai_studio, later danaview_ai,
      # danaview_ai_ui, danaview_ai_genkit.
      - 'packages/danaview_ai*/**'
  push:
    branches: [main]
    # Same list as pull_request above.
    paths:
      - 'packages/danaview_editor*/**'
      - 'packages/danaview_transcription/**'
      - 'packages/danaview_whisper/**'
      - 'test/architecture/**'
      - 'scripts/ci/editor/**'
      - '.github/workflows/editor-ci.yml'
      - 'packages/danaview_features/**'
      - 'docs/v1.1/editor/BUILD_PLAN.md'
      - 'packages/danaview_ai*/**'
  schedule:
    # Nightly suites (fuzz, full overflow matrix, AI eval): 02:30 UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner for the ios and whisper-host (macOS) jobs; macos-15 is the hosted fallback'
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - macos-15
      nightly:
        description: 'Also run the nightly job'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: editor-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'

jobs:
  workflow-lint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (with shellcheck) on editor-ci.yml
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/editor-ci.yml

  dart-core:
    name: dart-core
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/core.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/core.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=dart-core skipped::scripts/ci/editor/core.sh does not exist yet (owner: CORE-01)"
          fi
      - name: Set up Flutter (Dart SDK)
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run core.sh
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/core.sh

  flutter-packages:
    name: flutter-packages
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/flutter_packages.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/flutter_packages.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=flutter-packages skipped::scripts/ci/editor/flutter_packages.sh does not exist yet (owner: INT-01)"
          fi
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run flutter_packages.sh
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/flutter_packages.sh

  ai-dart:
    name: ai-dart
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/ai.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/ai.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ai-dart skipped::scripts/ci/editor/ai.sh does not exist yet (owner: AIS-01)"
          fi
      - name: Set up Flutter (Dart SDK)
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run ai.sh (analyze and test the AI packages)
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/ai.sh

  whisper-host:
    name: whisper-host (${{ matrix.name }})
    if: github.event_name != 'schedule'
    # Linux legs on ubuntu-latest; the macOS leg on the self-hosted Mac unless the dispatch input
    # `runner` or the repository variable EDITOR_MACOS_RUNNER selects the hosted macos-15 fallback.
    runs-on: ${{ matrix.host == 'linux' && 'ubuntu-latest' || (inputs.runner == 'macos-15' || vars.EDITOR_MACOS_RUNNER == 'macos-15') && 'macos-15' || fromJSON('["self-hosted", "macOS"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            host: linux
            sanitizer: none
          - name: linux-tsan
            host: linux
            sanitizer: thread
          - name: linux-asan
            host: linux
            sanitizer: address
          - name: macos
            host: macos
            sanitizer: none
    env:
      DANAVIEW_SANITIZER: ${{ matrix.sanitizer }}
      DANAVIEW_CI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/whisper_host.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/whisper_host.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=whisper-host skipped::scripts/ci/editor/whisper_host.sh does not exist yet (owner: AI-03)"
          fi
      - name: Cache test models
        if: steps.script.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: .ci-cache/whisper
          key: whisper-host-${{ runner.os }}-${{ hashFiles('scripts/ci/editor/whisper_host.sh') }}
      - name: Run whisper_host.sh (sanitizer ${{ matrix.sanitizer }})
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/whisper_host.sh

  android-unit:
    name: android-unit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/android_unit.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/android_unit.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=android-unit skipped::scripts/ci/editor/android_unit.sh does not exist yet (owner: ENG-09)"
          fi
      - name: Set up Java
        if: steps.script.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run android_unit.sh
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/android_unit.sh

  android-emulator:
    name: android-emulator (API 35 x86_64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/android_emulator.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/android_emulator.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=android-emulator skipped::scripts/ci/editor/android_emulator.sh does not exist yet (owner: ENG-09)"
          fi
      - name: Enable KVM
        if: steps.script.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java
        if: steps.script.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run android_emulator.sh on an API 35 x86_64 emulator
        if: steps.script.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/editor/android_emulator.sh

  ios:
    name: ios (Xcode 26.6, iOS 26 simulator)
    if: github.event_name != 'schedule'
    # Self-hosted Mac (scripts/ci/editor/README.md) unless the dispatch input `runner` or the
    # repository variable EDITOR_MACOS_RUNNER selects the hosted macos-15 fallback.
    runs-on: ${{ (inputs.runner == 'macos-15' || vars.EDITOR_MACOS_RUNNER == 'macos-15') && 'macos-15' || fromJSON('["self-hosted", "macOS"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/ios.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/ios.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ios skipped::scripts/ci/editor/ios.sh does not exist yet (owner: ENG-09)"
          fi
      - name: ios.sh must run check_ios_min_os.sh (D-41)
        if: steps.script.outputs.present == 'true'
        run: |
          if ! grep -q 'check_ios_min_os.sh' scripts/ci/editor/ios.sh; then
            echo "::error title=D-41::scripts/ci/editor/ios.sh must run scripts/ci/editor/check_ios_min_os.sh"
            exit 1
          fi
      - name: Select Xcode 26.6
        if: steps.script.outputs.present == 'true'
        run: |
          for app in /Applications/Xcode_26.6.app /Applications/Xcode-26.6.app /Applications/Xcode.app; do
            if [ -d "$app" ] && DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version | grep -q '^Xcode 26\.6'; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              echo "Using $app"
              exit 0
            fi
          done
          echo "::warning title=Xcode::Xcode 26.6 not found; using $(xcodebuild -version | head -n 1)"
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run ios.sh
        if: steps.script.outputs.present == 'true'
        env:
          LANG: en_US.UTF-8
        run: bash scripts/ci/editor/ios.sh

  nightly:
    name: nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DANAVIEW_CI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v4
      - name: Look for scripts/ci/editor/nightly.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/nightly.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=nightly skipped::scripts/ci/editor/nightly.sh does not exist yet (owner: INT-01)"
          fi
      - name: Set up Java
        if: steps.script.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache nightly inputs
        if: steps.script.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: nightly-${{ runner.os }}-${{ hashFiles('scripts/ci/editor/nightly.d/*.sh') }}
      - name: Run nightly.sh (every nightly.d/*.sh)
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/nightly.sh
