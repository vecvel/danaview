# OWNER: INT-01
# EXTENDED: AIS-01 (ai-dart job and the AI package paths)
# EXTENDED: INT-101 (v12-dart, v12-flutter and home-preservation jobs with path filters;
# scripts/ci/v12/README.md)
#
# Danaview CI (ARCH §22; named "Editor CI" in editor-ci.yml until 2026-10-23). Every job checks
# out the repo, then runs its script under scripts/ci/editor/ when that script exists and prints a
# skip notice otherwise (the owning ticket creates the script; owners are listed in
# scripts/ci/editor/README.md). The release workflows (android-release.yml, android-internal.yml,
# linux-release.yml, windows-release.yml) are independent of this file.
name: Danaview CI

on:
  pull_request:
    paths:
      - 'packages/danaview_editor*/**'
      - 'packages/danaview_transcription/**'
      - 'packages/danaview_whisper/**'
      - 'test/architecture/**'
      - 'scripts/ci/editor/**'
      - '.github/workflows/danaview-ci.yml'
      # The architecture test also guards danaview_features (ARCH §4.2 rule 1 and the ARCH §1.3
      # Material scan) and reads the BUILD_PLAN owns lists, so changes there run it too.
      - 'packages/danaview_features/**'
      - 'docs/v1.1/editor/BUILD_PLAN.md'
      # 1.2.0 AI packages (AIS-01): danaview_ai_providers, danaview_ai_studio, later danaview_ai,
      # danaview_ai_ui, danaview_ai_genkit.
      - 'packages/danaview_ai*/**'
      # 1.2.0 (INT-101): the Files & Media Home packages, face tracking, search, the platform bridge
      # (HOM-21), the 1.2.0 root tests and scripts. Each 1.2.0 job filters further (job `changes`).
      - 'packages/danaview_library*/**'
      - 'packages/danaview_pdf/**'
      - 'packages/danaview_documents/**'
      - 'packages/danaview_face_tracking/**'
      - 'packages/danaview_search/**'
      - 'packages/danaview_platform/**'
      - 'test/v12/**'
      - 'test/home_screen_test.dart'
      - 'scripts/ci/v12/**'
      - 'docs/v1.2/ARCHITECTURE.md'
  push:
    branches: [main]
    # Same list as pull_request above.
    paths:
      - 'packages/danaview_editor*/**'
      - 'packages/danaview_transcription/**'
      - 'packages/danaview_whisper/**'
      - 'test/architecture/**'
      - 'scripts/ci/editor/**'
      - '.github/workflows/danaview-ci.yml'
      - 'packages/danaview_features/**'
      - 'docs/v1.1/editor/BUILD_PLAN.md'
      - 'packages/danaview_ai*/**'
      - 'packages/danaview_library*/**'
      - 'packages/danaview_pdf/**'
      - 'packages/danaview_documents/**'
      - 'packages/danaview_face_tracking/**'
      - 'packages/danaview_search/**'
      - 'packages/danaview_platform/**'
      - 'test/v12/**'
      - 'test/home_screen_test.dart'
      - 'scripts/ci/v12/**'
      - 'docs/v1.2/ARCHITECTURE.md'
  schedule:
    # Nightly suites (fuzz, full overflow matrix, AI eval): 02:30 UTC.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Also run the nightly job'
        type: boolean
        default: false
      ios_runner_tests_only:
        description: 'ios job: stop after RunnerTests (skip the device build and integration suites)'
        type: boolean
        default: false
      ios_only_testing:
        description: 'ios job: xcodebuild -only-testing filter for RunnerTests (e.g. RunnerTests/ChannelRoundTripTests; comma-separated for several)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: danaview-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'
  # GitHub-hosted Apple-silicon image for the ios job and the macOS leg of whisper-host (no
  # self-hosted Mac is registered). macos-26 ships Xcode 26.6 (default) with the iOS 26.5 simulator.
  XCODE_VERSION: '26.6'
  JAVA_VERSION: '17'

jobs:
  workflow-lint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (with shellcheck) on danaview-ci.yml and android-internal.yml
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -config-file scripts/ci/editor/actionlint.yaml .github/workflows/danaview-ci.yml .github/workflows/android-internal.yml

  dart-core:
    name: dart-core
    if: github.event_name != 'schedule'
    # macOS: the compile-lowering JSON goldens are written on the Mac lane (arm64) and carry
    # last-digit float results that differ on x86_64 Linux; CI computes them on the same image.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/core.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/core.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=dart-core skipped::scripts/ci/editor/core.sh does not exist yet (owner: CORE-01)"
          fi
      - name: Set up Flutter (Dart SDK)
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run core.sh test
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/core.sh test

  dart-core-benchmark:
    name: dart-core-benchmark
    if: github.event_name != 'schedule'
    # The core benchmark gate (CORE-35). benchmark/baseline.json is recorded on the dev Mac (Apple M2,
    # 8 cores); no CI runner matches it, so run.dart scales the baseline by a per-row-kind host factor
    # measured in the same run (benchmark/src/calibration.dart). The absolute ARCH §18.2 budgets are
    # device budgets, gated only with DV_PERF_STRICT=1 (dev Mac); CI gates regressions. ubuntu-latest because
    # its 4 vCPUs time steadily (p90/p50 1.03-1.25); the 3-vCPU macos-26 VM dart-core needs for its
    # JSON goldens is noisier (p90/p50 up to 1.7).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/core.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/core.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=dart-core-benchmark skipped::scripts/ci/editor/core.sh does not exist yet (owner: CORE-01)"
          fi
      - name: Set up Flutter (Dart SDK)
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run core.sh benchmark
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/core.sh benchmark

  flutter-packages:
    name: flutter-packages
    if: github.event_name != 'schedule'
    # macOS: this job compares goldens, which the Mac lane renders on macOS; CI renders on the
    # same hosted image so text and antialiasing match pixel for pixel (no tolerance, no Linux goldens).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/flutter_packages.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/flutter_packages.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=flutter-packages skipped::scripts/ci/editor/flutter_packages.sh does not exist yet (owner: INT-01)"
          fi
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run flutter_packages.sh
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/flutter_packages.sh

  ai-dart:
    name: ai-dart
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/ai.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/ai.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ai-dart skipped::scripts/ci/editor/ai.sh does not exist yet (owner: AIS-01)"
          fi
      - name: Set up Flutter (Dart SDK)
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run ai.sh (analyze and test the AI packages)
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/ai.sh

  # 1.2.0 (INT-101): which 1.2.0 jobs a pull request needs (scripts/ci/v12/README.md). Pushes to
  # main, the nightly schedule and manual dispatches run all of them.
  changes:
    name: changes (1.2.0 path filters)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      v12_dart: ${{ steps.filter.outputs.v12_dart }}
      v12_flutter: ${{ steps.filter.outputs.v12_flutter }}
      home_preservation: ${{ steps.filter.outputs.home_preservation }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            v12_dart:
              - 'packages/danaview_library/**'
              - 'packages/danaview_search/**'
              - 'packages/danaview_domain/**'
              - 'packages/danaview_editor_core/lib/photo.dart'
              - 'packages/danaview_editor_core/lib/beauty.dart'
              - 'packages/danaview_editor_core/lib/src/photo/**'
              - 'packages/danaview_editor_core/lib/src/color/**'
              - 'packages/danaview_editor_core/lib/src/beauty/**'
              - 'packages/danaview_editor_core/lib/src/plan/**'
              - 'packages/danaview_editor_core/lib/src/ops/**'
              - 'packages/danaview_editor_core/test/**'
              - 'scripts/ci/v12/library.sh'
              - '.github/workflows/danaview-ci.yml'
            v12_flutter:
              - 'packages/danaview_library*/**'
              - 'packages/danaview_pdf/**'
              - 'packages/danaview_documents/**'
              - 'packages/danaview_face_tracking/**'
              - 'packages/danaview_search/**'
              - 'packages/danaview_features/**'
              - 'packages/danaview_ui_kit/**'
              - 'packages/danaview_editor/lib/src/app/flags_v12.dart'
              - 'packages/danaview_editor/lib/src/editor/contracts/**'
              - 'packages/danaview_editor/lib/src/editor/wiring/**'
              - 'test/architecture/**'
              - 'test/v12/**'
              - 'docs/v1.2/ARCHITECTURE.md'
              - 'scripts/ci/v12/documents.sh'
              - 'scripts/ci/v12/face.sh'
              - '.github/workflows/danaview-ci.yml'
            home_preservation:
              - 'packages/danaview_features/lib/src/library/**'
              - 'packages/danaview_platform/**'
              - 'packages/danaview_library*/**'
              - 'test/v12/preservation/**'
              - 'test/home_screen_test.dart'
              - 'scripts/ci/v12/home_preservation.sh'
              - '.github/workflows/danaview-ci.yml'

  v12-dart:
    name: v12-dart (library, search, core photo)
    needs: changes
    # `needs` with a skipped `changes` (push, dispatch) still runs thanks to always().
    if: always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.v12_dart == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter (Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run scripts/ci/v12/library.sh
        run: bash scripts/ci/v12/library.sh

  v12-flutter:
    name: v12-flutter (documents, features, face tracking)
    needs: changes
    if: always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.v12_flutter == 'true')
    # macOS: this job compares goldens, which the Mac lane renders on macOS; CI renders on the
    # same hosted image so text and antialiasing match pixel for pixel (no tolerance, no Linux goldens).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run scripts/ci/v12/documents.sh
        run: bash scripts/ci/v12/documents.sh
      - name: Run scripts/ci/v12/face.sh
        run: bash scripts/ci/v12/face.sh

  home-preservation:
    name: home-preservation (HOM-15 merge gate)
    needs: changes
    if: always() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.home_preservation == 'true')
    # macOS: this job compares goldens, which the Mac lane renders on macOS; CI renders on the
    # same hosted image so text and antialiasing match pixel for pixel (no tolerance, no Linux goldens).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/v12/home_preservation.sh
        id: script
        run: |
          if [ -f scripts/ci/v12/home_preservation.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=home-preservation skipped::scripts/ci/v12/home_preservation.sh does not exist yet (owner: HOM-15)"
          fi
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run home_preservation.sh
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/v12/home_preservation.sh

  whisper-host:
    name: whisper-host (${{ matrix.name }})
    if: github.event_name != 'schedule'
    # Linux legs on ubuntu-latest; the macOS leg on the GitHub-hosted macos-26 (Apple silicon). The
    # real-model tests download the two pinned models (sha256-checked) once and reuse the cache.
    runs-on: ${{ matrix.host == 'linux' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            host: linux
            sanitizer: none
          - name: linux-tsan
            host: linux
            sanitizer: thread
          - name: linux-asan
            host: linux
            sanitizer: address
          - name: macos
            host: macos
            sanitizer: none
    env:
      DANAVIEW_SANITIZER: ${{ matrix.sanitizer }}
      DANAVIEW_CI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/whisper_host.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/whisper_host.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=whisper-host skipped::scripts/ci/editor/whisper_host.sh does not exist yet (owner: AI-03)"
          fi
      - name: Cache test models
        if: steps.script.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: .ci-cache/whisper
          key: whisper-host-${{ runner.os }}-${{ hashFiles('scripts/ci/editor/whisper_host.sh') }}
      - name: Select Xcode ${{ env.XCODE_VERSION }} (macOS)
        if: steps.script.outputs.present == 'true' && matrix.host == 'macos'
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - name: Run whisper_host.sh (sanitizer ${{ matrix.sanitizer }})
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/whisper_host.sh

  android-unit:
    name: android-unit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/android_unit.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/android_unit.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=android-unit skipped::scripts/ci/editor/android_unit.sh does not exist yet (owner: ENG-09)"
          fi
      - name: Set up Java
        if: steps.script.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run android_unit.sh
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/android_unit.sh

  android-emulator:
    name: android-emulator (API 35 x86_64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/android_emulator.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/android_emulator.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=android-emulator skipped::scripts/ci/editor/android_emulator.sh does not exist yet (owner: ENG-09)"
          fi
      - name: Enable KVM
        if: steps.script.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then echo "::error title=KVM::/dev/kvm is not accessible"; exit 1; fi
      - name: Set up Java
        if: steps.script.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # A booted AVD snapshot, cached: later runs start from it instead of a cold boot.
      - name: Cache the AVD
        if: steps.script.outputs.present == 'true'
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-google_apis-pixel_6-r5
      - name: Create the AVD and its snapshot
        if: steps.script.outputs.present == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot created"
      - name: Run android_emulator.sh on an API 35 x86_64 emulator
        if: steps.script.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # emulator_ready.sh: boot check with one relaunch, and a relaunch when the emulator stops
          # answering during a batch or suite (same AVD and options).
          DANAVIEW_EMULATOR_AVD: test
          DANAVIEW_EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          DANAVIEW_EMULATOR_BOOT_TIMEOUT: 600
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: false
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/editor/emulator_ready.sh && bash scripts/ci/editor/android_emulator.sh

  ios:
    name: ios (Xcode 26.6, iOS 26 simulator)
    # GitHub-hosted macos-26 (Apple silicon, Xcode 26.6, iOS 26.5 simulator). Pull requests run the
    # quick suites (device build, D-41 check, RunnerTests, engine_smoke and ios_preview); push to
    # main, manual dispatch and the nightly schedule run every integration_test suite. ios.sh picks
    # the first iPhone on the newest iOS runtime (override with DANAVIEW_IOS_SIMULATOR).
    runs-on: macos-26
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 150 }}
    env:
      DANAVIEW_IOS_SUITES: ${{ github.event_name == 'pull_request' && 'smoke ios_preview' || 'smoke ios_preview accuracy av_sync parity conformance preset_matrix audio_mix' }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/ios.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/ios.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ios skipped::scripts/ci/editor/ios.sh does not exist yet (owner: ENG-09)"
          fi
      - name: ios.sh must run check_ios_min_os.sh (D-41)
        if: steps.script.outputs.present == 'true'
        run: |
          if ! grep -q 'check_ios_min_os.sh' scripts/ci/editor/ios.sh; then
            echo "::error title=D-41::scripts/ci/editor/ios.sh must run scripts/ci/editor/check_ios_min_os.sh"
            exit 1
          fi
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: steps.script.outputs.present == 'true'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcrun simctl list runtimes available | grep -i ios
      - name: Cache CocoaPods
        if: steps.script.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            packages/danaview_editor_engine/example/ios/Pods
          key: ios-pods-${{ runner.os }}-${{ hashFiles('packages/danaview_editor_engine/example/ios/Podfile.lock', 'packages/danaview_editor_engine/example/ios/Podfile', 'packages/*/ios/*.podspec') }}
          restore-keys: ios-pods-${{ runner.os }}-
      - name: Cache WhisperCore.xcframework
        if: steps.script.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: packages/danaview_whisper/ios/Frameworks
          key: whisper-xcframework-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('packages/danaview_whisper/tool/build_ios_xcframework.sh', 'packages/danaview_whisper/src/**', 'packages/danaview_whisper/third_party/**/CMakeLists.txt') }}
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run ios.sh
        if: steps.script.outputs.present == 'true'
        env:
          LANG: en_US.UTF-8
          DANAVIEW_IOS_ONLY_TESTING: ${{ inputs.ios_only_testing }}
          RUNNER_TESTS_ONLY: ${{ inputs.ios_runner_tests_only && 'true' || 'false' }}
        run: |
          if [ "$RUNNER_TESTS_ONLY" = true ]; then
            bash scripts/ci/editor/ios.sh --no-device-build --runner-tests-only
          else
            bash scripts/ci/editor/ios.sh
          fi

  nightly:
    name: nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DANAVIEW_CI_CACHE_DIR: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v7
      - name: Look for scripts/ci/editor/nightly.sh
        id: script
        run: |
          if [ -f scripts/ci/editor/nightly.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=nightly skipped::scripts/ci/editor/nightly.sh does not exist yet (owner: INT-01)"
          fi
      - name: Set up Java
        if: steps.script.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Flutter
        if: steps.script.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache nightly inputs
        if: steps.script.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: .ci-cache
          key: nightly-${{ runner.os }}-${{ hashFiles('scripts/ci/editor/nightly.d/*.sh') }}
      - name: Run nightly.sh (every nightly.d/*.sh)
        if: steps.script.outputs.present == 'true'
        run: bash scripts/ci/editor/nightly.sh
