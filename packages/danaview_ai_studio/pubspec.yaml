# OWNER: AIS-01
#
# AI Studio, the editor's AI feature module (AI_STUDIO_PLAN §3.1, §3.6; ARCH v1.2 §4.1): service,
# planning, batching, action contracts, review, translation. No widgets.
#
# Rule 10 (test/architecture/dependency_rules_test.dart): danaview_ai (when AIS-43 adds it),
# danaview_ai_providers (types), danaview_editor_core, danaview_transcription, characters,
# collection, meta, path. Never the engine packages, danaview_editor, danaview_features or
# danaview_secure_keys; no widget code. `flutter` is listed only because danaview_transcription
# needs it.
name: danaview_ai_studio
description: Danaview AI Studio - the editor's bring-your-own-key AI actions on captions (plan, disclose, send, review). No widgets.
version: 1.2.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.3.0
  collection: ^1.18.0
  meta: ^1.11.0
  path: ^1.9.0
  danaview_ai_providers:
    path: ../danaview_ai_providers
  danaview_editor_core:
    path: ../danaview_editor_core
  danaview_transcription:
    path: ../danaview_transcription

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
