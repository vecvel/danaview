# OWNER: AI-02
name: danaview_whisper
description: On-device speech recognition for Danaview Auto captions - whisper.cpp behind a small C ABI (FFI plugin, iOS and Android only).
version: 1.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

# ARCH §4.2 rule 5: no danaview_* package.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  meta: ^1.11.0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# iOS and Android only: desktop builds compile the Dart API and report unsupported(platform).
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
        package: com.vecvel.danaview.whisper
        pluginClass: DanaviewWhisperPlugin
      ios:
        ffiPlugin: true
        pluginClass: DanaviewWhisperPlugin
