# OWNER: CORE-01
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
