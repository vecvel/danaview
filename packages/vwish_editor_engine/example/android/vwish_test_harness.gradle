// OWNER: ENG-09
//
// Native test harness of the editor engine plugin, applied by ../build.gradle.kts to the plugin
// module `:vwish_editor_engine` once its com.android.library plugin is applied. It lives in the
// example host (not in the plugin's build.gradle.kts, which ENG-08/ENG-06 own) and only adds test
// configuration; it never changes what the plugin ships.
//
//  * src/test (JVM): junit, the JDK's java.awt/javax.imageio classes at compile time (see
//    extractVwishJdkDesktopClasses), plus the pure-JVM frame barcode reader from
//    src/androidTest/kotlin/.../support (ENG-05) as an extra source root. The fixture roots are
//    passed as system properties: vwish.fixtures (engine test_fixtures/media, ENG-05's
//    FrameBarcodeTest), vwish.fixtures.engine (engine test_fixtures),
//    vwish.fixtures.core (vwish_editor_core/test/fixtures) and vwish.fixtures.engine_api
//    (vwish_editor_engine_api/test_fixtures).
//  * src/androidTest (instrumented): AndroidJUnitRunner, androidx.test, and the same three fixture
//    trees as assets under fixtures/engine/, fixtures/core/ and fixtures/engine_api/ (copied into
//    build/generated/vwishTestFixtures by syncVwishTestFixtures, so the trees never collide).
//
// Every addition is skipped when the plugin's own build already declares it, so ENG-08 may move
// any of it into the plugin's build.gradle.kts later without a duplicate source root.

def engineFixtures = file("${projectDir}/../test_fixtures")
def coreFixtures = file("${projectDir}/../../vwish_editor_core/test/fixtures")
def engineApiFixtures = file("${projectDir}/../../vwish_editor_engine_api/test_fixtures")
def barcodeSupport = file("${projectDir}/src/androidTest/kotlin/com/vecvel/vwish/editor/engine/support")
def generatedAssets = layout.buildDirectory.dir("generated/vwishTestFixtures").get().asFile

def syncFixtures = tasks.register("syncVwishTestFixtures", Sync) {
    description = "Copies the shared test fixtures into the androidTest assets (ENG-09)."
    into(generatedAssets)
    from(engineFixtures) { into("fixtures/engine") }
    from(coreFixtures) { into("fixtures/core") }
    from(engineApiFixtures) { into("fixtures/engine_api") }
    exclude("**/.DS_Store")
}

def addSrcDir = { sourceDirectorySet, File dir ->
    if (!sourceDirectorySet.srcDirs.any { it.canonicalPath == dir.canonicalPath }) {
        sourceDirectorySet.srcDir(dir)
    }
}

// finalizeDsl runs after the plugin's own build script, so whatever it declares is seen first.
androidComponents {
    finalizeDsl { android ->
        if (!android.defaultConfig.testInstrumentationRunner) {
            android.defaultConfig.testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        }
        def test = android.sourceSets.getByName("test")
        addSrcDir(test.java, file("${projectDir}/src/test/kotlin"))
        addSrcDir(test.java, barcodeSupport)
        def androidTest = android.sourceSets.getByName("androidTest")
        addSrcDir(androidTest.java, file("${projectDir}/src/androidTest/kotlin"))
        addSrcDir(androidTest.assets, generatedAssets)
    }
}

tasks.withType(Test).configureEach {
    // ENG-05's FrameBarcodeTest reads vwish.fixtures as the media directory itself.
    systemProperty "vwish.fixtures", new File(engineFixtures, "media").canonicalPath
    systemProperty "vwish.fixtures.engine", engineFixtures.canonicalPath
    systemProperty "vwish.fixtures.core", coreFixtures.canonicalPath
    systemProperty "vwish.fixtures.engine_api", engineApiFixtures.canonicalPath
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}

// Asset merging (and every task that reads the androidTest assets) runs after the copy.
tasks.configureEach { t ->
    if (t.name ==~ /.*AndroidTest.*Assets.*/) {
        t.dependsOn(syncFixtures)
    }
}

// JVM unit tests compile against android.jar, which has no javax.imageio / java.awt, but they run
// on the host JDK, which has them. The PNG-frame barcode tests (ENG-05 FrameBarcodeTest, the
// harness test) read frames with ImageIO, so the java.awt and javax.imageio classes of the JDK
// that runs Gradle are extracted from its jrt:/ image into a compile-only jar.
def jdkDesktopJar = layout.buildDirectory.file("generated/vwishJdkDesktop/java-desktop-subset.jar").get().asFile
def extractJdkDesktop = tasks.register("extractVwishJdkDesktopClasses") {
    description = "Extracts java.awt + javax.imageio class files from the JDK for JVM test compilation (ENG-09)."
    inputs.property("javaVersion", System.getProperty("java.version"))
    outputs.file(jdkDesktopJar)
    doLast {
        def fs = java.nio.file.FileSystems.getFileSystem(URI.create("jrt:/"))
        def root = fs.getPath("/modules/java.desktop")
        jdkDesktopJar.parentFile.mkdirs()
        def zip = new java.util.zip.ZipOutputStream(new FileOutputStream(jdkDesktopJar))
        try {
            def stream = java.nio.file.Files.walk(root)
            try {
                stream.iterator().each { p ->
                    def name = root.relativize(p).toString()
                    if (java.nio.file.Files.isRegularFile(p) && name.endsWith(".class") &&
                            (name.startsWith("java/awt/") || name.startsWith("javax/imageio/"))) {
                        zip.putNextEntry(new java.util.zip.ZipEntry(name))
                        zip.write(java.nio.file.Files.readAllBytes(p))
                        zip.closeEntry()
                    }
                }
            } finally {
                stream.close()
            }
        } finally {
            zip.close()
        }
    }
}

// Duplicates of what the plugin's build declares are harmless (Gradle dedupes them).
dependencies {
    testCompileOnly files(jdkDesktopJar) { builtBy(extractJdkDesktop) }
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
