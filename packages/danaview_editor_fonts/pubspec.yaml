# OWNER: UX-30
#
# Assets-only content-font package of the video editor (ARCH §17.8, D-30): the curated OFL-1.1
# families users can pick for text overlays and subtitles (Figtree, Inter, Montserrat, Oswald,
# Bebas Neue, Playfair Display, Lora, Caveat, Pacifico, JetBrains Mono), each with its OFL text.
# Content fonts are for user text only; the editor chrome stays Figtree from danaview_ui_kit.
#
# Families are registered as `packages/danaview_editor_fonts/<Family>`. The font section between
# the GENERATED markers is written by `dart run tool/fetch_fonts.dart` from the files present in
# fonts/ (see that script: it downloads the families that are not bundled yet, with the owner's
# approval, and regenerates this section and lib/src/bundled_fonts.g.dart).
name: danaview_editor_fonts
description: Content fonts for text overlays and subtitles in the Danaview video editor (OFL-1.1 families, assets only).
version: 1.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # BEGIN GENERATED FONTS (tool/fetch_fonts.dart)
  assets:
    - fonts/figtree/OFL.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/figtree/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/figtree/Figtree-Bold.ttf
          weight: 700
  # END GENERATED FONTS
