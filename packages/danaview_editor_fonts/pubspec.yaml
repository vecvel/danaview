# OWNER: UX-30
#
# Assets-only content-font package of the video editor (ARCH §17.8, D-30): the curated OFL-1.1
# families users can pick for text overlays and subtitles (Figtree, Inter, Montserrat, Oswald,
# Bebas Neue, Playfair Display, Lora, Caveat, Pacifico, JetBrains Mono), each with its OFL text.
# Content fonts are for user text only; the editor chrome stays Figtree from danaview_ui_kit.
#
# Families are registered as `packages/danaview_editor_fonts/<Family>`. The font section between
# the GENERATED markers is written by `dart run tool/fetch_fonts.dart` from the files present in
# fonts/ (see that script: it downloads the families that are not bundled yet, with the owner's
# approval, and regenerates this section and lib/src/bundled_fonts.g.dart).
name: danaview_editor_fonts
description: Content fonts for text overlays and subtitles in the Danaview video editor (OFL-1.1 families, assets only).
version: 1.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  crypto: ^3.0.5 # tool/fetch_fonts.dart (sha256 of the bundled files)
  flutter_test:
    sdk: flutter

flutter:
  # BEGIN GENERATED FONTS (tool/fetch_fonts.dart)
  assets:
    - fonts/figtree/OFL.txt
    - fonts/inter/OFL.txt
    - fonts/montserrat/OFL.txt
    - fonts/oswald/OFL.txt
    - fonts/bebasneue/OFL.txt
    - fonts/playfairdisplay/OFL.txt
    - fonts/lora/OFL.txt
    - fonts/caveat/OFL.txt
    - fonts/pacifico/OFL.txt
    - fonts/jetbrainsmono/OFL.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/figtree/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/figtree/Figtree-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-VF.ttf
          weight: 400
        - asset: fonts/inter/Inter-VF.ttf
          weight: 700
        - asset: fonts/inter/Inter-Italic-VF.ttf
          weight: 400
          style: italic
        - asset: fonts/inter/Inter-Italic-VF.ttf
          weight: 700
          style: italic
    - family: Montserrat
      fonts:
        - asset: fonts/montserrat/Montserrat-VF.ttf
          weight: 400
        - asset: fonts/montserrat/Montserrat-VF.ttf
          weight: 700
        - asset: fonts/montserrat/Montserrat-Italic-VF.ttf
          weight: 400
          style: italic
        - asset: fonts/montserrat/Montserrat-Italic-VF.ttf
          weight: 700
          style: italic
    - family: Oswald
      fonts:
        - asset: fonts/oswald/Oswald-VF.ttf
          weight: 400
        - asset: fonts/oswald/Oswald-VF.ttf
          weight: 700
    - family: Bebas Neue
      fonts:
        - asset: fonts/bebasneue/BebasNeue-Regular.ttf
          weight: 400
    - family: Playfair Display
      fonts:
        - asset: fonts/playfairdisplay/PlayfairDisplay-VF.ttf
          weight: 400
        - asset: fonts/playfairdisplay/PlayfairDisplay-VF.ttf
          weight: 700
        - asset: fonts/playfairdisplay/PlayfairDisplay-Italic-VF.ttf
          weight: 400
          style: italic
        - asset: fonts/playfairdisplay/PlayfairDisplay-Italic-VF.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: fonts/lora/Lora-VF.ttf
          weight: 400
        - asset: fonts/lora/Lora-VF.ttf
          weight: 700
        - asset: fonts/lora/Lora-Italic-VF.ttf
          weight: 400
          style: italic
        - asset: fonts/lora/Lora-Italic-VF.ttf
          weight: 700
          style: italic
    - family: Caveat
      fonts:
        - asset: fonts/caveat/Caveat-VF.ttf
          weight: 400
        - asset: fonts/caveat/Caveat-VF.ttf
          weight: 700
    - family: Pacifico
      fonts:
        - asset: fonts/pacifico/Pacifico-Regular.ttf
          weight: 400
    - family: JetBrains Mono
      fonts:
        - asset: fonts/jetbrainsmono/JetBrainsMono-VF.ttf
          weight: 400
        - asset: fonts/jetbrainsmono/JetBrainsMono-VF.ttf
          weight: 700
        - asset: fonts/jetbrainsmono/JetBrainsMono-Italic-VF.ttf
          weight: 400
          style: italic
        - asset: fonts/jetbrainsmono/JetBrainsMono-Italic-VF.ttf
          weight: 700
          style: italic
  # END GENERATED FONTS
