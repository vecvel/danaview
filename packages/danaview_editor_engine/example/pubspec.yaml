# OWNER: ENG-09
#
# Example host of the danaview_editor_engine plugin (BUILD_PLAN ENG-09). It exists to build the plugin
# on iOS and Android, to host the native test harness (example/ios/RunnerTests, the plugin's
# android/src/test and android/src/androidTest run through example/android) and to run the engine
# integration tests in integration_test/. It is not shipped.
name: danaview_editor_engine_example
description: Example host and native test harness of the Danaview editor engine plugin.
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  danaview_editor_engine:
    path: ../
  danaview_editor_engine_api:
    path: ../../danaview_editor_engine_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
