# OWNER: ENG-01
include: package:flutter_lints/flutter.yaml

analyzer:
  # Pigeon output (regenerated from pigeons/engine_api.dart; drift is caught by
  # test/glue/pigeon_regeneration_test.dart). Hand-written files in lib/src/pigeon/ are analyzed.
  exclude:
    - lib/src/pigeon/*.g.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
    - public_member_api_docs
