# OWNER: AIS-01
#
# Provider contracts, consent tickets, transport and the provider adapters of AI Studio
# (AI_STUDIO_PLAN §3.1, §3.5; ARCH v1.2 §4.1, §7). Pure Dart plus dart:io.
#
# Rule 9 (test/architecture/dependency_rules_test.dart): only meta, collection, crypto and the SDK.
