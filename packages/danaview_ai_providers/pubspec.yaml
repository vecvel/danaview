version: 1.2.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  crypto: ^3.0.3
  meta: ^1.11.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
