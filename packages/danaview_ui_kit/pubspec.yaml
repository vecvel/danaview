name: danaview_ui_kit
description: Custom OLED theme, interactive canvas seek bar, and volume booster UI components.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  danaview_domain:
    path: ../danaview_domain

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - fonts/OFL.txt
  # Figtree is the only typeface; the theme applies it to the whole app (see DanaviewFonts).
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
